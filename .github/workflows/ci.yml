name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        # postgres:17, pinned by digest.
        image: postgres@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_USER: crateward
          POSTGRES_PASSWORD: crateward-ci-only
          POSTGRES_DB: crateward_test
          POSTGRES_INITDB_ARGS: --data-checksums
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crateward"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      CRATEWARD_TEST_DATABASE_URL: host=localhost port=5432 user=crateward password=crateward-ci-only dbname=crateward_test
      CRATEWARD_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --all-features --locked

  doc:
    name: rustdoc
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --workspace --no-deps --all-features --locked

  guest-agent:
    name: guest agent (static musl)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build and verify that no dynamic loader is requested
        run: cargo xtask guest-agent

  guest-ebpf:
    name: guest eBPF programs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchains
        run: |
          rustup toolchain install
          cd crates/guest_ebpf && rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build with the pinned bpf-linker and check the license section
        run: cargo xtask guest-ebpf

  deploy:
    name: deployment checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install ansible-core (hash pinned), nftables and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes nftables shellcheck
          python3 -m venv "$RUNNER_TEMP/ansible"
          "$RUNNER_TEMP/ansible/bin/pip" install --require-hashes -r deploy/ansible/requirements.txt
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"
          # Ubuntu restricts unprivileged user namespaces with AppArmor. The
          # firewall check loads the rules in one.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: cargo xtask deploy-check

  docs:
    name: documentation checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit check reads the whole history.
          fetch-depth: 0
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo xtask docs-lint
      - run: cargo xtask commit-lint
      - run: cargo xtask blank-lines
      - run: cargo xtask state-diagram

  supply-chain:
    name: cargo deny, audit and vet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-vet@0.10.2
      - run: cargo deny --locked check
      # The root deny.toml ignores advisories of host dependencies that the
      # eBPF lockfile does not contain.
      - run: cargo deny --manifest-path crates/guest_ebpf/Cargo.toml --locked check --allow advisory-not-detected
      - run: cargo audit
      - run: cargo vet --locked
