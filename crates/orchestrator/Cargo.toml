[package]
name = "crateward_orchestrator"
description = "Runs jobs in Firecracker microVMs and guarantees their cleanup."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "crateward_orchestrator"
path = "src/main.rs"

[[bin]]
name = "crateward-vmjail"
path = "src/bin/vmjail.rs"

[dependencies]
bytes.workspace = true
crateward_fake_internet.workspace = true
# Reads scratch disks in a sandboxed child (`scratch`).
ext4-view.workspace = true
crateward_core = { workspace = true, features = ["app", "blobs", "cratesio", "sandbox", "store"] }
http-body-util.workspace = true
rand.workspace = true
semver.workspace = true
tar.workspace = true
rustix = { workspace = true, features = ["fs", "mount", "process", "system", "thread", "stdio"] }
hyper.workspace = true
hyper-util.workspace = true
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing.workspace = true

[lints]
workspace = true
