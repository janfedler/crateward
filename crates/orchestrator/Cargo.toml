[package]
name = "crateward_orchestrator"
description = "Runs jobs in Firecracker microVMs and guarantees their cleanup."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "crateward_orchestrator"
path = "src/main.rs"

[[bin]]
name = "crateward-vmjail"
path = "src/bin/vmjail.rs"

[dependencies]
bytes.workspace = true
crateward_core = { workspace = true, features = ["app"] }
http-body-util.workspace = true
rustix = { workspace = true, features = ["fs", "mount", "process", "system", "thread", "stdio"] }
hyper.workspace = true
hyper-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[lints]
workspace = true
