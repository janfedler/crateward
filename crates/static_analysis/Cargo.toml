[package]
name = "crateward_static_analysis"
description = "Parses crate sources without executing them and produces findings with evidence."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true

[[bin]]
name = "crateward-static-analysis"
path = "src/main.rs"

[dependencies]
crateward_core = { workspace = true, features = ["app", "blobs", "sandbox", "store"] }
proc-macro2.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
syn.workspace = true
toml.workspace = true
yara-x.workspace = true

[dev-dependencies]
crateward_core = { workspace = true, features = ["testing"] }
tokio-postgres.workspace = true

[lints]
workspace = true
