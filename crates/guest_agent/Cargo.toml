[package]
name = "crateward_guest_agent"
description = "Agent inside the microVM: runs the job offline and streams observed behavior to the host."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# Without the `app` feature: the guest never reads the host configuration.
crateward_core.workspace = true
rustix = { workspace = true, features = ["mount", "process", "system", "time", "fs"] }
thiserror.workspace = true
vsock.workspace = true

[lints]
workspace = true
