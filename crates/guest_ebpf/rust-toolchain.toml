# The eBPF programs build with the nightly that the pinned bpf-linker was
# released for (guest/bpf-linker.toml): bpf-linker reads the compiler's LLVM
# bitcode, so both must use the same LLVM version. `build-std` needs
# `rust-src`. Bump both together.
[toolchain]
channel = "nightly-2026-09-07"
components = ["rust-src", "rustfmt", "clippy"]
profile = "minimal"
