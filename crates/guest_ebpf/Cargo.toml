[package]
name = "crateward_guest_ebpf"
description = "eBPF programs the guest agent loads to trace a build (ADR 0007)."
version = "0.1.0"
edition = "2024"
# The kernel only lets GPL compatible programs call the helpers these
# programs need (Documentation/bpf/bpf_licensing.rst). This package is
# therefore GPL-2.0-only, while the rest of the project is MIT OR
# Apache-2.0 (ADR 0010). The full text is in LICENSE next to this file.
license = "GPL-2.0-only"
publish = false
repository = "https://github.com/janfedler/crateward"

# Its own workspace: it builds for `bpfel-unknown-none` with a nightly
# toolchain, which the main workspace must not inherit.
[workspace]

# Every unsafe block states why it is sound, as in the main workspace.
[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dependencies]
aya-ebpf = { version = "0.2.1", default-features = false }

[[bin]]
name = "crateward-guest-ebpf"
path = "src/main.rs"
test = false
bench = false

[profile.dev]
panic = "abort"
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
