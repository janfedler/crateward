[package]
name = "crateward_supervisor"
description = "Keeps the pipeline healthy without a human: health checks, breakers, canaries, retention and alerts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true

[[bin]]
name = "crateward-supervisor"
path = "src/main.rs"

[dependencies]
crateward_core = { workspace = true, features = ["app", "store", "integrity"] }
reqwest.workspace = true
rustix = { workspace = true, features = ["fs"] }
secrecy.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
crateward_core = { workspace = true, features = ["testing"] }
serde_json.workspace = true

[lints]
workspace = true
