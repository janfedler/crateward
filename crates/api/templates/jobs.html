{% extends "base.html" %}
{% block title %}Crateward: jobs{% endblock %}
{% block content %}
<h1>Jobs</h1>
<form class="filters" method="get" action="/jobs">
  <input name="name" placeholder="crate name prefix" value="{{ name }}">
  <select name="level">
    <option value="">any level</option>
    {% for l in levels %}<option value="{{ l }}"{% if *l == *level %} selected{% endif %}>{{ l }}</option>{% endfor %}
  </select>
  <button type="submit">Filter</button>
</form>
{% include "rows.html" %}
{% endblock %}
