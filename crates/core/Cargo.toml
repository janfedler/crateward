[package]
name = "crateward_core"
description = "Shared types, typed configuration, errors and the job state machine of Crateward."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true

[features]
default = []
# Process harness for host services: command line parsing, tracing setup,
# the runtime and the stop signal. The guest agent does not enable it.
app = ["dep:clap", "dep:tokio", "dep:tracing", "dep:tracing-subscriber"]
# The Postgres job store (ADR 0001). Host services only.
store = ["dep:tokio-postgres", "dep:tokio", "cratesio", "dep:tracing"]
# Parsers for crates.io data: sparse index lines and RSS feeds.
cratesio = ["dep:serde_json", "dep:semver", "dep:quick-xml"]
# The polite HTTP client for crates.io.
http = ["dep:reqwest", "dep:tokio", "dep:bytes"]
# Namespaces, resource limits and Landlock for workers handling hostile input.
sandbox = ["dep:rustix", "dep:landlock"]
# The content addressed blob store of crate archives (ADR 0004).
blobs = ["dep:blake3", "dep:zstd"]
# The host integrity manifest (ADR 0008).
integrity = ["dep:blake3"]

[dependencies]
blake3 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
landlock = { workspace = true, optional = true }
postcard.workspace = true
quick-xml = { workspace = true, optional = true }
rand.workspace = true
reqwest = { workspace = true, optional = true }
rustix = { workspace = true, optional = true, features = ["process", "thread"] }
secrecy.workspace = true
semver = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["signal"] }
tokio-postgres = { workspace = true, optional = true }
toml.workspace = true
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
url.workspace = true
zstd = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-postgres.workspace = true

[lints]
workspace = true
