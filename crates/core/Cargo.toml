[package]
name = "crateward_core"
description = "Shared types, typed configuration, errors and the job state machine of Crateward."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
# Process harness for host services: command line parsing and tracing setup.
# The guest agent does not enable it.
app = ["dep:clap", "dep:tracing", "dep:tracing-subscriber"]

[dependencies]
clap = { workspace = true, optional = true }
postcard.workspace = true
rand.workspace = true
secrecy.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
