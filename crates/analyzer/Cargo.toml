[package]
name = "crateward_analyzer"
description = "Scores runs with explainable reasons and stores behavior profiles."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true

[[bin]]
name = "crateward-analyzer"
path = "src/main.rs"

[dependencies]
crateward_core = { workspace = true, features = ["app", "store", "sbom"] }
# The report types the other stages store. Only types are used, nothing of
# these packages runs in the analyzer (ADR 0009).
crateward_orchestrator.workspace = true
crateward_static_analysis.workspace = true
secrecy.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
crateward_core = { workspace = true, features = ["testing"] }
tokio.workspace = true

[lints]
workspace = true
