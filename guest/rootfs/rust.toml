# Pinned Rust toolchain for the guest image, installed under /usr/local.
#
# The same release as rust-toolchain.toml, so the host and the guest agree
# on the compiler that jobs see. The digests come from the release's
# channel manifest (dist/channel-rust-1.98.1.toml), whose SHA-256 file
# matched and whose OpenPGP signature verified on 2026-09-25 as a good
# signature from the Rust release key, fingerprint
# 108F 6620 5EAE B0AA A8DD 5E1C 85AB 96E6 FA1B E5FE. `cargo xtask rootfs`
# refuses a download whose SHA-256 differs.

version = "1.98.1"

[[component]]
# Directory inside the archive that holds the component's files.
dir = "rustc"
url = "https://static.rust-lang.org/dist/2026-09-03/rustc-1.98.1-x86_64-unknown-linux-gnu.tar.xz"
sha256 = "e974f036b28565f37c0f3bd92ddefa809bee16c04f9dcf07b9ed96e05aaaf7c4"

[[component]]
dir = "cargo"
url = "https://static.rust-lang.org/dist/2026-09-03/cargo-1.98.1-x86_64-unknown-linux-gnu.tar.xz"
sha256 = "ea1de9f9e23107d97ee2b41a72c552f34064a593da503789218387aee59f3ba4"

[[component]]
dir = "rust-std-x86_64-unknown-linux-gnu"
url = "https://static.rust-lang.org/dist/2026-09-03/rust-std-1.98.1-x86_64-unknown-linux-gnu.tar.xz"
sha256 = "fa3ff450172a16c026944030230c5069947af93c728d9179971d44e5e0cfb561"
