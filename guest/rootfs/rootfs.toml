# Pinned inputs of the guest root filesystem.
#
# `cargo xtask rootfs` builds a Debian base with mmdebstrap in unshare mode
# (no root needed), from snapshot.debian.org at a fixed point in time, then
# adds the Rust toolchain, the fake internet's authority and the guest agent
# and packs everything into a read only EROFS image.

[debian]
suite = "trixie"
# snapshot.debian.org serves the archive as it was at this time.
snapshot = "20260924T000000Z"
variant = "minbase"
# Extra packages: what build scripts commonly expect on a developer machine.
# The download tools are there on purpose: a build script that fetches a
# payload should try, so the fake internet records the attempt. The Rust
# toolchain comes from guest/rootfs/rust.toml.
packages = [
    "ca-certificates",
    "cmake",
    "curl",
    "g++",
    "gcc",
    "libc6-dev",
    "libclang-dev",
    "libdbus-1-dev",
    "libsqlite3-dev",
    "libssl-dev",
    "libudev-dev",
    "make",
    "perl",
    "pkg-config",
    "protobuf-compiler",
    "python3",
    "wget",
    "xz-utils",
    "zlib1g-dev",
]

[image]
# Fixed timestamp for every file in the image, for reproducible builds.
source_date_epoch = 1790208000
# EROFS compressor. The guest kernel enables LZ4 decompression.
compression = "lz4hc"
