# Crateward configuration.
#
# Every service reads this file. Unknown keys are rejected and every value is
# validated at startup. `crateward config check` runs the same validation.
#
# Secrets (database.url, ntfy.topic) belong in the deployed copy only,
# which Ansible installs readable by the service users.

[instance]
# Name used in alerts and in the public export.
name = "crateward"
# Durable state on disk: content addressed store, evidence, logs.
data_dir = "/var/lib/crateward"
# Volatile state in tmpfs: promoted images, sockets, per job scratch.
run_dir = "/run/crateward"

[telemetry]
# "json" for journald, "pretty" for development.
log_format = "json"
# A tracing filter directive. RUST_LOG overrides it.
log_filter = "info"

[database]
# Peer authentication over the local socket: no password in this file.
url = "postgresql://crateward@localhost/crateward?host=/run/postgresql"

[crates_io]
# The data access policy asks for a user agent that identifies the
# application and a way to contact its operator.
user_agent = "crateward/0.1 (+https://example.com/about; security@example.com)"
index_url = "https://index.crates.io/"
static_url = "https://static.crates.io/"
rss_updates_url = "https://static.crates.io/rss/updates.xml"
rss_new_crates_url = "https://static.crates.io/rss/crates.xml"
db_dump_url = "https://static.crates.io/db-dump.tar.gz"
# Request rates towards the CDN and the sparse index. crates.io publishes no
# limit for either. These are our own courtesy.
static_requests_per_second = 5.0
index_requests_per_second = 20.0
# The feeds cover the last 60 minutes, so polling every 2 minutes never
# misses a version.
rss_poll_interval_secs = 120
# The dump is refreshed every 24 hours.
db_dump_refresh_hours = 24

# Per stage worker settings. A lease is renewed by heartbeats. A worker that
# stops heartbeating loses its claim, and the job consumes one attempt.
# Backoff uses full jitter between 0 and a ceiling that doubles per attempt
# from backoff_base_secs up to backoff_cap_secs.

[stages.fetch]
lease_secs = 300
max_attempts = 5
max_infrastructure_retries = 100
backoff_base_secs = 10
backoff_cap_secs = 3600

[stages.static_analysis]
lease_secs = 300
max_attempts = 3
max_infrastructure_retries = 100
backoff_base_secs = 10
backoff_cap_secs = 1800

[stages.sandbox]
lease_secs = 120
max_attempts = 3
max_infrastructure_retries = 50
backoff_base_secs = 30
backoff_cap_secs = 3600

[stages.analysis]
lease_secs = 120
max_attempts = 3
max_infrastructure_retries = 100
backoff_base_secs = 5
backoff_cap_secs = 600

[stages.finalize]
lease_secs = 120
max_attempts = 5
max_infrastructure_retries = 100
backoff_base_secs = 5
backoff_cap_secs = 600

[triage]
# A job waiting longer than this for a VM slot is scored as static only and
# labeled with that reason.
dynamic_deadline_hours = 12
# Reverse dependencies from which a crate counts as popular. Updates to
# popular crates get dynamic analysis first.
popular_min_reverse_dependencies = 100
# All time downloads from which a crate counts as popular. A dependency with
# build time code that is neither popular nor locked by an earlier version
# makes a job dynamic.
popular_min_downloads = 1000000

[sandbox]
slots = 3
vcpus_per_slot = 1
memory_mib_per_slot = 4096
scratch_mib_per_slot = 4096
check_timeout_secs = 900
full_timeout_secs = 2700
firecracker_bin = "/usr/local/lib/crateward/firecracker"
# The rootless jail launcher (ADR 0002).
vmjail_bin = "/usr/local/lib/crateward/crateward-vmjail"
# The fake internet, started in every slot's network namespace.
fake_internet_bin = "/usr/local/lib/crateward/crateward-fake-internet"
# Its TLS authority (certificate and key), from `cargo xtask rootfs`, which
# also makes the guest image trust the certificate. Mode 0600.
fake_internet_authority = "/usr/local/lib/crateward/guest/current/authority.pem"
# Guest images, from `cargo xtask guest-kernel` and `cargo xtask rootfs`.
# `current` is a link that a deploy or a rollback moves (ADR 0002). The
# orchestrator resolves it once at startup.
kernel_image = "/usr/local/lib/crateward/guest/current/kernel.bzImage"
rootfs_image = "/usr/local/lib/crateward/guest/current/rootfs.erofs"
# One subdirectory per slot, private to the orchestrator user.
slots_dir = "/run/crateward/slots"
# Slot n runs Firecracker as slot_uid_base + n. The range must lie in the
# orchestrator user's /etc/subuid and /etc/subgid entries.
slot_uid_base = 200000
slot_gid_base = 200000
# Minutes between canary runs: a known bad and a known good inert crate
# must produce the expected results (ADR 0008). 0 turns them off.
canary_interval_minutes = 60

# The warm build cache (ADR 0006): the orchestrator replays the dependency
# builds of recent jobs in a VM and mounts the result read only under every
# job's target directory. Leave this table out to build every job cold.
[sandbox.warm]
# Recent fetches to choose from, and how many of them to replay at most.
sample_jobs = 400
max_probes = 80
# A crate version enters only if this many sampled jobs lock it, and only
# if Crateward stored its file at least this long ago (two weeks).
min_jobs = 3
min_age_hours = 336
# The whole warm build. Each replay gets check_timeout_secs on its own.
timeout_secs = 5400
max_image_mib = 6144

[storage]
# Above this usage the maintainer is alerted.
disk_alert_percent = 85
# Raw logs of runs that were not flagged are deleted after this many days.
raw_log_retention_days = 7

[fetcher]
# The real cargo binary of the pinned toolchain, not the rustup proxy
# (`rustup which cargo`). Its toolchain directory is readable in the
# resolution sandbox.
cargo_bin = "/usr/local/lib/crateward/toolchain/bin/cargo"
# Keep the original .crate file of every analyzed version as evidence.
keep_originals = true

[supervisor]
# Seconds between two rounds of checks.
interval_secs = 30
# A stage's breaker opens when, within the window, at least min_failures
# infrastructure failures happened and they make up failure_percent of the
# stage's results. It lets jobs through again after the cooldown, which
# doubles after each failed probe up to the maximum. After it closes, the
# window starts at the close.
breaker_window_secs = 900
breaker_min_failures = 5
breaker_failure_percent = 50
breaker_cooldown_secs = 300
breaker_max_cooldown_secs = 7200
# The same alert is sent again at most this often.
alert_repeat_hours = 24
# Minutes between two checks of the files in the integrity manifest
# (`crateward integrity record` writes it after every deploy).
integrity_interval_minutes = 60
# Decoy files: planted when missing, and any open of one raises a sandbox
# escape alert. Exclude them from backups and indexers.
decoys = [
    "/home/crateward/.aws/credentials",
    "/home/crateward/.ssh/id_ed25519_github",
    "/var/lib/crateward/decoys/deploy-token",
]

# Push notifications for alerts. Leave this table out to only log them.
[ntfy]
server_url = "https://ntfy.sh"
# Without access control the topic name is the password. Replace with the
# output of `openssl rand -hex 24`.
topic = "example_topic_replace_with_48_random_hex_chars"

# The public site (ADR 0001), a static export of aggregate statistics
# pushed to GitHub Pages. Leave this table out to only write it locally.
[export]
repository = "git@github.com:example/crateward-site.git"
branch = "main"
# A deploy key with write access to the site repository only.
deploy_key = "/etc/crateward/site-deploy-key"
interval_hours = 24

[web]
# Loopback only: the maintainer reaches the dashboard through an SSH tunnel,
# `ssh -L 8080:127.0.0.1:8080 <server>` (ADR 0009).
listen = "127.0.0.1:8080"
