# cargo-deny policy. Run with `cargo deny --locked check`.

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the build unless it is listed here with a reason.
# The same list is in .cargo/audit.toml for cargo-audit. Each entry names the
# release that makes it obsolete. Remove it then.
ignore = [
    # wasmtime 45 (through yara-x, whose newest release 1.21.0 still requires
    # ^45.0.3): stores can mix up type indices between engines. YARA-X creates
    # a single global Engine (src/wasm/mod.rs, ENGINE.get_or_init), so there is
    # no second engine. Remove when yara-x moves to wasmtime >= 46.0.3.
    { id = "RUSTSEC-2026-0222", reason = "yara-x uses one global wasmtime Engine; see deny.toml" },
    # wasmtime 45: WASI filesystem sandbox escape with trailing slashes.
    # YARA-X does not enable WASI, and the analysis child has no filesystem
    # access (Landlock). Remove with the entry above.
    { id = "RUSTSEC-2026-0269", reason = "WASI is not used; the child has no filesystem access" },
    # wasmtime 45: dynamic record lifting can allocate beyond the hostcall
    # fuel limit. Records are lifted only by the component model, and YARA-X
    # builds wasmtime without the `component-model` feature, so that code is
    # not compiled in. Remove with the entries above (fixed in 48.0.3).
    { id = "RUSTSEC-2026-0316", reason = "the wasmtime component model is not compiled in" },
    # wasmtime 45: the result count of an async lifted component callback is
    # not validated, which overflows a native stack buffer. Also component
    # model code only, which is not compiled in. Remove with the entries above
    # (fixed in 48.0.4 and 49.0.2).
    { id = "RUSTSEC-2026-0327", reason = "the wasmtime component model is not compiled in" },
    # bincode 2 is unmaintained. YARA-X uses it only to (de)serialize compiled
    # rules, which Crateward never loads from outside. Rules are compiled from
    # source embedded in the binary.
    { id = "RUSTSEC-2025-0141", reason = "only for compiled rule serialization, unused" },
]

[licenses]
# Permissive licenses only. Additions need a reason in the pull request.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Permissive data license of the Mozilla CA bundle (webpki-root-certs),
    # pulled in by reqwest's platform certificate verifier.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# Keep the allowlist stable as dependencies come and go.
unused-allowed-license = "allow"

[licenses.private]
# Workspace packages are not published. They are MIT OR Apache-2.0, except
# crateward_guest_ebpf, which is GPL-2.0-only (ADR 0010).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the unpublished workspace are fine.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
