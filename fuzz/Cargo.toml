[package]
name = "crateward_fuzz"
description = "Fuzz targets for every parser of hostile input."
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace: it builds with the nightly pin and sanitizer flags.
[workspace]

[lib]
path = "src/lib.rs"

# Exactly one engine: libFuzzer for `cargo fuzz`, AFL++ for `cargo afl`.
[features]
default = ["libfuzzer"]
libfuzzer = ["dep:libfuzzer-sys"]
afl = ["dep:afl"]

[dependencies]
afl = { version = "=0.18.2", optional = true }
libfuzzer-sys = { version = "0.4", optional = true }
ext4-view = { version = "1.0", features = ["std"] }
crateward_core = { path = "../crates/core" }
crateward_fake_internet = { path = "../crates/fake_internet" }
crateward_fetcher = { path = "../crates/fetcher" }
crateward_guest_agent = { path = "../crates/guest_agent" }
crateward_orchestrator = { path = "../crates/orchestrator" }
crateward_static_analysis = { path = "../crates/static_analysis" }

[profile.release]
debug = 1

[[bin]]
name = "archive"
path = "fuzz_targets/archive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "btf"
path = "fuzz_targets/btf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns"
path = "fuzz_targets/dns.rs"
test = false
doc = false
bench = false

[[bin]]
name = "index-line"
path = "fuzz_targets/index-line.rs"
test = false
doc = false
bench = false

[[bin]]
