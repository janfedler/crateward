[workspace]
resolver = "3"
members = ["crates/*"]
# Builds for the BPF target with its own nightly toolchain and lockfile
# (ADR 0007). `cargo xtask guest-ebpf` builds it.
exclude = ["crates/guest_ebpf"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
# Nothing in this workspace is published to crates.io. `crates/guest_ebpf`
# has its own license (ADR 0010).
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/janfedler/crateward"
homepage = "https://crateward.com"

[workspace.dependencies]
askama = "0.16"
axum = { version = "0.8", default-features = false, features = ["form", "http1", "query", "tokio", "tracing"] }
futures-util = { version = "0.3", default-features = false }
aya = { version = "0.14", default-features = false }
crateward_api = { path = "crates/api" }
crateward_core = { path = "crates/core" }
crateward_fake_internet = { path = "crates/fake_internet" }
crateward_orchestrator = { path = "crates/orchestrator" }
crateward_static_analysis = { path = "crates/static_analysis" }
blake3 = "1.8"
clap = { version = "4.6", features = ["derive", "env"] }
csv = "1.4"
ext4-view = { version = "1.0", features = ["std"] }
flate2 = "1.1"
bytes = "1.12"
http-body-util = "0.1"
hyper = { version = "1.11", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde_json = "1.0"
syn = { version = "2", default-features = false, features = ["full", "visit", "parsing", "printing", "extra-traits"] }
semver = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "process", "time", "io-util", "fs", "sync"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
landlock = "0.4"
proc-macro2 = { version = "1", features = ["span-locations"] }
proptest = "1.11"
quick-xml = "0.42"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rand = "0.10"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
rustix = "1.1"
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
spdx = "0.13"
tar = "0.4"
thiserror = "2.0"
toml = "1.1"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2.5", features = ["serde"] }
vsock = "0.5"
yara-x = { version = "1.20", default-features = false, features = ["constant-folding", "exact-atoms", "fast-regexp"] }
zstd = "0.13"

[workspace.lints.rust]
# Unsafe code is denied everywhere. Packages without any unsafe code
# additionally `#![forbid]` it at the crate root. The only exception is
# `crateward_core::sandbox`, which documents its one unsafe block.
unsafe_code = "deny"
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
# Production paths never panic: errors are typed and propagated.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
# Every unsafe block states why it is sound.
undocumented_unsafe_blocks = "deny"
